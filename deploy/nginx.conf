# AI交付管理能力培训 — nginx配置
# 关键：proxy_pass 末尾 / 的区别
#  有 / → nginx 吞掉 location 前缀，Python 收到 /
#  无 / → nginx 保留完整路径，Python 收到 /training/api

location /training/ {
    proxy_pass http://127.0.0.1:8100/;
    proxy_set_header Host $host;
}

location /training/api {
    proxy_pass http://127.0.0.1:8100;
    proxy_set_header Host $host;
    proxy_read_timeout 10s;
}

location /training/content/ {
    alias /var/www/training/content/;
    add_header Cache-Control "no-cache";
}
