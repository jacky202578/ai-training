<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AI交付管理能力培训 v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pri:#1a73e8;--pri-light:#e8f0fe;--bg:#f5f5f5;--card:#fff;--text:#1a1a1a;--text2:#666;--border:#e0e0e0;--green:#0d9e6c;--orange:#e67e22;--red:#e74c3c;--radius:10px;--shadow:0 1px 4px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:70px}
.tab-bar{position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--text2);cursor:pointer;transition:color .2s;user-select:none;-webkit-tap-highlight-color:transparent}
.tab-item .icon{font-size:20px;margin-bottom:2px}
.tab-item.active{color:var(--pri)}
.page{display:none;padding:16px;padding-bottom:80px;min-height:100vh}
.page.active{display:block}
.header{background:var(--pri);color:#fff;padding:48px 16px 20px;margin:-16px -16px 16px;border-radius:0 0 16px 16px}
.header h1{font-size:20px;font-weight:700;margin-bottom:4px}
.header .sub{font-size:13px;opacity:.85}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font-size:15px;margin-bottom:8px}
.card p{font-size:13px;color:var(--text2);line-height:1.6}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge-l1{background:#e8f5e9;color:#2e7d32}
.badge-l2{background:#fff3e0;color:#e65100}
.badge-l3{background:#e3f2fd;color:#1565c0}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:var(--green);border-radius:3px;transition:width .3s}
.btn{display:inline-block;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:600;border:none;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
.btn-pri{background:var(--pri);color:#fff}
.btn-outline{background:var(--card);color:var(--pri);border:1px solid var(--pri)}
.btn-block{display:block;width:100%}
.lesson-card{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border-radius:var(--radius);margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s}
.lesson-card:active{transform:scale(.98)}
.lesson-num{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.lesson-info{flex:1;min-width:0}
.lesson-info h4{font-size:14px;margin-bottom:2px}
.lesson-info .meta{font-size:12px;color:var(--text2)}
.lesson-status{font-size:12px;flex-shrink:0}
.locked{opacity:.5;pointer-events:none}
.locked .lesson-num{background:#e0e0e0!important;color:#999}
.done .lesson-num{background:#e8f5e9!important;color:var(--green)}
.stage-header{padding:12px 0 8px;font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.detail-header{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--card);margin:-16px -16px 12px;position:sticky;top:0;z-index:10;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.detail-header .back{font-size:20px;cursor:pointer;padding:4px}
.detail-header h2{font-size:16px;flex:1}
.empty{text-align:center;padding:40px 16px;color:var(--text2)}
.empty .icon{font-size:48px;margin-bottom:12px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.quiz-option{display:block;width:100%;padding:12px;margin:6px 0;border:1.5px solid var(--border);border-radius:8px;background:var(--card);text-align:left;font-size:13px;cursor:pointer;transition:all .15s}
.quiz-option.selected{background:var(--pri-light);border-color:var(--pri)}
.quiz-option.correct{background:#e8f5e9;border-color:var(--green);color:var(--green)}
.quiz-option.wrong{background:#ffebee;border-color:var(--red);color:var(--red)}
.result-banner{padding:16px;border-radius:var(--radius);text-align:center;margin:12px 0}
.result-banner.pass{background:#e8f5e9;color:var(--green)}
.result-banner.fail{background:#fff3e0;color:var(--orange)}
.content-body{font-size:14px;line-height:1.8;color:var(--text)}
.content-body h3{font-size:15px;margin:16px 0 8px}
.content-body p{margin:10px 0}
.content-body table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.content-body th,.content-body td{border:1px solid var(--border);padding:8px;text-align:left}
.content-body th{background:#f8f9fa;font-weight:600}
.content-body pre{background:#1e1e1e;color:#d4d4d4;padding:12px;border-radius:6px;overflow-x:auto;font-size:12px;line-height:1.5;margin:10px 0;white-space:pre-wrap}
.content-body code{font-size:12px;background:#f4f4f5;padding:1px 4px;border-radius:3px}
.content-body ul,.content-body ol{padding-left:20px;margin:8px 0}
.content-body li{margin:4px 0}
.content-body blockquote{border-left:3px solid var(--pri);padding-left:12px;color:var(--text2);margin:12px 0;font-style:italic}
.content-body hr{border:none;border-top:1px solid var(--border);margin:16px 0}
.task-box{margin:16px 0;padding:12px;background:#f8f9fa;border-radius:8px;border-left:3px solid var(--pri)}
.task-box strong{display:block;margin-bottom:4px}
.post-box{margin:12px 0;padding:12px;background:#f0f7ff;border-radius:8px}
.post-box strong{display:block;margin-bottom:4px}
.ref-box{margin-top:8px;padding:8px;background:#fff;border-radius:6px;font-size:12px;color:var(--green);white-space:pre-wrap}
</style>
</head>
<body>

<div id="page-matrix" class="page active">
  <div class="header"><h1>📊 能力矩阵</h1><div class="sub">AI交付管理能力 · 三层九维</div></div>
  <div id="matrix-content"></div>
</div>

<div id="page-lessons" class="page">
  <div class="header"><h1>📚 课程体系</h1><div class="sub" id="progress-summary">加载中…</div><div style="font-size:10px;opacity:.5;margin-top:4px">v2</div></div>
  <div id="lessons-content"></div>
</div>

<div id="page-report" class="page">
  <div class="header"><h1>📈 我的报告</h1><div class="sub" id="report-subtitle">学习进度与能力成长</div></div>
  <div id="report-content"><div class="empty"><div class="icon">📭</div><p>完成第一课后这里会有你的学习数据</p></div></div>
</div>

<div id="detail-view" style="display:none">
  <div class="detail-header"><span class="back" onclick="closeDetail()">←</span><h2 id="detail-title"></h2><span id="detail-badge"></span></div>
  <div id="detail-body" style="padding:16px"></div>
</div>

<div class="tab-bar">
  <div class="tab-item active" data-page="matrix" onclick="switchTab('matrix')"><span class="icon">📊</span>能力矩阵</div>
  <div class="tab-item" data-page="lessons" onclick="switchTab('lessons')"><span class="icon">📚</span>课程体系</div>
  <div class="tab-item" data-page="report" onclick="switchTab('report')"><span class="icon">📈</span>我的报告</div>
</div>

<div id="toast" class="toast"></div>

<script>
var API='/training/api',CONTENT='/training/content',UID='',_lessons=[],_progress={},_currentLesson=null,_preTestAnswers=[];
(function initApp(){
  UID=localStorage._uid||('user_'+Date.now());localStorage._uid=UID;
  loadMatrix();loadLessons();
  // Reset to first tab on init
  document.querySelectorAll('.tab-item').forEach(function(t){t.classList.remove('active')});
  var first=document.querySelector('[data-page="matrix"]');if(first)first.classList.add('active');
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
  var mp=document.getElementById('page-matrix');if(mp)mp.classList.add('active');
  document.getElementById('detail-view').style.display='none';
})();
window.addEventListener('pageshow',function(e){if(e.persisted){initApp();}});

function switchTab(t){
  document.querySelectorAll('.tab-item').forEach(function(x){x.classList.remove('active')});
  document.querySelector('[data-page="'+t+'"]').classList.add('active');
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
  document.getElementById('page-'+t).classList.add('active');
  document.getElementById('detail-view').style.display='none';
  document.getElementById('page-'+t).style.display='block';
}

function openDetail(id){
  document.querySelectorAll('.page').forEach(function(p){p.style.display='none'});
  document.getElementById('detail-view').style.display='block';
  renderLessonDetail(id);
}

function closeDetail(){
  document.getElementById('detail-view').style.display='none';
  var t=document.querySelector('.tab-item.active').getAttribute('data-page');
  document.getElementById('page-'+t).style.display='block';
}

function toast(m){
  var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2000);
}

var _mdCache={};
function md(s){
  if(!s)return'';
  if(_mdCache[s])return _mdCache[s];
  var h=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  h=h.replace(/^#### (.+)$/gm,'<h4>$1</h4>');
  h=h.replace(/^- (.+)$/gm,'<li>$1</li>');
  h=h.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/```(\w*)\n([\s\S]*?)```/g,'<pre>$2</pre>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/\n\n/g,'</p><p>');
  h=h.replace(/\n---\n/g,'<hr>');
  h='<p>'+h+'</p>';
  h=h.replace(/<p><\/p>/g,'');
  _mdCache[s]=h;
  return h;
}

function loadMatrix(){
  fetch(CONTENT+'/matrix.json').then(function(r){return r.json()}).then(function(d){
    var lvls=d.levels||[{id:'L1',name:'能审',desc:'看懂AI的输出'},{id:'L2',name:'能验',desc:'验证逻辑正确性'},{id:'L3',name:'能沟通',desc:'写出AI能执行的规格'}];
    var dims=d.dimensions||['认知理解','实操技能','判断决策'];
    var colors={'L1':'#2e7d32','L2':'#e65100','L3':'#1565c0'},vals={'L1':[3,2,1],'L2':[4,3,2],'L3':[5,4,3]};
    var h='<div class="card" style="text-align:center;padding:16px"><canvas id="radar" width="300" height="300"></canvas>';
    h+='<div style="display:flex;justify-content:center;gap:24px;margin-top:16px;flex-wrap:wrap">';
    lvls.forEach(function(l){
      h+='<div style="text-align:left"><span style="display:inline-block;width:12px;height:12px;border-radius:2px;background:'+colors[l.id]+';vertical-align:middle;margin-right:6px"></span>';
      h+='<strong style="font-size:13px;color:'+colors[l.id]+'">'+l.id+' '+l.name+'</strong>';
      h+='<div style="font-size:11px;color:#888;margin-top:2px">'+dims.map(function(dm,di){return dm.substring(0,2)+':'+(vals[l.id][di]||0)}).join('  ')+'</div></div>';
    });
    h+='</div></div>';
    h+='<div class="card"><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;text-align:center"><thead><tr><th style="padding:8px;background:#f8f9fa"></th>';
    lvls.forEach(function(l){h+='<th style="padding:8px;background:#f8f9fa;font-weight:700"><span class="badge badge-l1">'+l.id+'</span><br>'+l.name+'</th>';});
    h+='</tr></thead><tbody>';
    var descs={'L1':{'认知理解':'理解AI工作原理','实操技能':'读懂AI输出','判断决策':'识别逻辑漏洞'},'L2':{'认知理解':'理解系统架构','实操技能':'功能测试执行','判断决策':'验收标准判定'},'L3':{'认知理解':'业务-技术映射','实操技能':'需求结构化表达','判断决策':'方案合理性评审'}};
    dims.forEach(function(dim){h+='<tr><td style="padding:8px;background:#f8f9fa;font-weight:600">'+dim+'</td>';
      lvls.forEach(function(l){h+='<td style="padding:8px;border:1px solid var(--border)">'+(descs[l.id]&&descs[l.id][dim]||'—')+'</td>';});
      h+='</tr>';});
    h+='</tbody></table></div></div>';
    lvls.forEach(function(lv){h+='<div class="card"><h3><span class="badge badge-l1">'+lv.id+'</span> '+lv.name+'</h3><p>'+lv.desc+'</p></div>';});
    document.getElementById('matrix-content').innerHTML=h;
    setTimeout(function(){drawRadar(lvls,dims);},100);
  }).catch(function(){document.getElementById('matrix-content').innerHTML='<div class="empty"><div class="icon">📡</div><p>内容加载中</p></div>'});
}


function drawRadar(lvls,dims){
  var c=document.getElementById('radar');if(!c)return;
  var ctx=c.getContext('2d'),W=c.width,H=c.height,cx=W/2,cy=150,r=Math.min(cx,cy)-40;
  var n=dims.length,colors=['#2e7d32','#e65100','#1565c0'],vals=[[3,2,1],[4,3,2],[5,4,3]];
  for(var i=1;i<=5;i++){
    ctx.beginPath();ctx.strokeStyle='#e0e0e0';ctx.lineWidth=0.5;
    for(var j=0;j<n;j++){var a=Math.PI*2*j/n-Math.PI/2,rr=r*i/5,x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;j===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    ctx.closePath();ctx.stroke();
  }
  ctx.fillStyle='#666';ctx.font='11px sans-serif';ctx.textAlign='center';
  for(var j=0;j<n;j++){
    var a=Math.PI*2*j/n-Math.PI/2;
    ctx.beginPath();ctx.strokeStyle='#ccc';ctx.lineWidth=1;
    ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);ctx.stroke();
    var lx=cx+Math.cos(a)*(r+22),ly=cy+Math.sin(a)*(r+22)+4;
    ctx.fillText(dims[j],lx,ly);
  }
  lvls.forEach(function(_,li){ctx.beginPath();ctx.strokeStyle=colors[li];ctx.lineWidth=2;ctx.fillStyle=colors[li]+'20';
    for(var j=0;j<n;j++){var a=Math.PI*2*j/n-Math.PI/2,rr=r*vals[li][j]/5,x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;j===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    ctx.closePath();ctx.fill();ctx.stroke();
  });
  // Legend — stacked vertically to avoid overlap
  var legendY=H-50;
  ctx.fillStyle='#fff';ctx.fillRect(0,legendY-10,W,60);
  lvls.forEach(function(l,i){
    var y=legendY+i*18;
    ctx.fillStyle=colors[i];ctx.fillRect(10,y-6,10,10);
    ctx.fillStyle='#333';ctx.font='11px sans-serif';ctx.textAlign='left';
    ctx.fillText(l.id+' '+l.name,26,y+2);
    // Show dimension values
    var v=vals[i];ctx.fillStyle='#888';ctx.font='9px sans-serif';
    ctx.fillText(dims.map(function(d,di){return d.substring(0,2)+':'+v[di]}).join(' | '),26,y+12);
  });
}
function loadLessons(){
  Promise.all([
    fetch(CONTENT+'/curriculum.json?_='+Date.now()).then(function(r){return r.json()}),
    fetch(API+'?uid='+UID+'&_='+Date.now()).then(function(r){return r.json()}).catch(function(){return{}})
  ]).then(function(r){
    _lessons=r[0].lessons||[];_progress=r[1].lessons||{};renderLessons();updateProgress();
  }).catch(function(){document.getElementById('lessons-content').innerHTML='<div class="empty"><div class="icon">📡</div><p>内容加载中</p></div>'});
}

function renderLessons(){
  var h='',sn={1:'第一阶段：认知重塑',2:'第二阶段：审查能力',3:'第三阶段：验收能力',4:'第四阶段：沟通能力'},ls=0;
  _lessons.forEach(function(l,i){
    if(l.stage!==ls){h+='<div class="stage-header">'+(sn[l.stage]||'第'+l.stage+'阶段')+'</div>';ls=l.stage;}
    var p=_progress[l.id]||{},s=p.status||'';
    var done=s==='done';
    var bg=done?'#e8f5e9':'#e3f2fd';
    var ct=done?'var(--green)':'var(--pri)';
    var st=done?'✅':'📝';
    h+='<div class="lesson-card" onclick="openDetail(\''+l.id+'\')">';
    h+='<div class="lesson-num" style="background:'+bg+';color:'+ct+'">'+(i+1)+'</div>';
    h+='<div class="lesson-info"><h4>'+l.title+'</h4><div class="meta">⏱ '+l.duration+'min · '+l.level+'</div></div>';
    h+='<div class="lesson-status">'+st+'</div></div>';
  });
  document.getElementById('lessons-content').innerHTML=h||'<div class="empty"><div class="icon">📭</div><p>暂无课程</p></div>';
}

function updateProgress(){
  var d=0;_lessons.forEach(function(l){if((_progress[l.id]||{}).status==='done')d++;});
  var p=_lessons.length?Math.round(d/_lessons.length*100):0;
  document.getElementById('progress-summary').textContent='已完成 '+d+'/'+_lessons.length+' 课（'+p+'%）';
}

function renderLessonDetail(id){
  fetch(CONTENT+'/lessons/'+id+'.json').then(function(r){return r.json()}).then(function(d){
    _currentLesson=d;var p=_progress[id]||{};
    document.getElementById('detail-title').textContent=d.title;
    document.getElementById('detail-badge').innerHTML='<span class="badge badge-l1">'+d.level+'</span>';
    var h='';
    h+='<div class="card"><p>⏱ '+d.duration+'分钟 · 📐 '+d.project+'</p>';
    if(d.prerequisite)h+='<p style="font-size:12px;color:var(--text2);margin-top:4px">前置：'+d.prerequisite+'</p>';
    h+='<div style="margin-top:8px"><strong>学习目标：</strong><ul style="margin:4px 0 0 16px;font-size:13px">';
    (d.objectives||[]).forEach(function(o){h+='<li>'+o+'</li>';});
    h+='</ul></div></div>';

    h+='<div class="card"><h3>📝 课前自测（'+(d.preTest||[]).length+'题）</h3>';
    h+='<div id="pretest-container" style="margin-top:12px">';
    if(p.pre_test_done)h+='<div class="result-banner pass">✅ 已完成 · 得分 '+p.pre_score+'/'+(d.preTest||[]).length+'</div>';
    else h+='<div id="pretest-questions"></div>';
    h+='</div></div>';

    (d.sections||[]).forEach(function(sec){
      h+='<div class="card"><h3>📖 '+sec.title+'</h3>';
      h+='<div class="content-body" style="margin-top:12px">'+md(sec.content)+'</div>';
      if(sec.tasks){sec.tasks.forEach(function(t){
        h+='<div class="task-box"><strong>'+t.name+'</strong>';
        if(t.desc)h+='<p style="font-size:13px;color:var(--text2);margin:4px 0">'+t.desc+'</p>';
        if(t.steps){h+='<ol style="font-size:13px;margin:8px 0 0 16px">';t.steps.forEach(function(s){h+='<li>'+s+'</li>'});h+='</ol>';}
        if(t.diffs){t.diffs.forEach(function(di){h+='<div style="font-size:12px;margin:8px 0"><strong>问：</strong>'+di.question+'</div><div style="font-size:12px;color:var(--green);margin-bottom:8px">答：'+di.answer+'</div>';});}
        if(t.scenario)h+='<div style="font-size:13px;margin:8px 0;white-space:pre-wrap">'+t.scenario+'</div>';
        if(t.reference)h+='<div style="font-size:12px;color:var(--green);margin:8px 0;white-space:pre-wrap">参考：'+t.reference+'</div>';
        if(t.text)h+='<div style="font-size:13px;margin:8px 0;white-space:pre-wrap">'+t.text+'</div>';
        if(t.checklist){h+='<div style="margin-top:8px"><strong>✅ 完成清单：</strong><ul style="font-size:12px;margin:4px 0 0 16px">';t.checklist.forEach(function(c){h+='<li>'+c+'</li>'});h+='</ul></div>';}
        h+='</div>';
      });}
      h+='</div>';
    });

    if(d.postTest){h+='<div class="card"><h3>📋 课后练习</h3>';
      d.postTest.forEach(function(pt,pti){
        h+='<div class="post-box"><strong>第'+(pti+1)+'题：</strong><span style="font-size:13px;white-space:pre-wrap">'+pt.question+'</span>';
        h+='<div id="post-ref-'+pti+'" style="display:none" class="ref-box">💡 参考：'+pt.reference+'</div>';
        h+='<button class="btn btn-outline" style="margin-top:8px;font-size:11px" onclick="document.getElementById(\'post-ref-'+pti+'\').style.display=\'block\'">查看参考答案</button></div>';
      });
      h+='</div>';}

    if(d.supplements){h+='<div class="card"><h3>📎 补充材料</h3>';
      d.supplements.forEach(function(sup){h+='<div style="margin:8px 0"><strong>'+sup.title+'</strong><ul style="font-size:13px;margin:4px 0 0 16px">';sup.items.forEach(function(item){h+='<li>'+item+'</li>'});h+='</ul></div>';});
      h+='</div>';}

    if(p.status!=='done')h+='<button class="btn btn-pri btn-block" onclick="markComplete()" style="margin:16px 0">✅ 完成本课</button>';
    else h+='<div class="result-banner pass" style="margin:16px 0">✅ 本课已完成</div>';

    document.getElementById('detail-body').innerHTML=h;
    if(!p.pre_test_done&&d.preTest){_preTestAnswers=[];renderPreTest(d.preTest);}
  }).catch(function(){document.getElementById('detail-body').innerHTML='<div class="empty"><div class="icon">📡</div><p>课程内容加载失败</p></div>'});
}

function renderPreTest(qs){
  var h='';
  qs.forEach(function(q,qi){
    h+='<p style="font-weight:600;margin:12px 0 4px">'+(qi+1)+'. '+q.question+'</p>';
    q.options.forEach(function(opt,oi){
      var sel=_preTestAnswers[qi]===oi;
      h+='<button class="quiz-option'+(sel?' selected':'')+'" onclick="selectPreTest('+qi+','+oi+')">'+opt+'</button>';
    });
  });
  h+='<button class="btn btn-pri btn-block" onclick="submitPreTest()" style="margin-top:12px">提交答案</button>';
  document.getElementById('pretest-questions').innerHTML=h;
}

function selectPreTest(qi,oi){_preTestAnswers[qi]=oi;renderPreTest(_currentLesson.preTest||[]);}

function submitPreTest(){
  var qs=_currentLesson.preTest||[],c=0;
  qs.forEach(function(q,qi){if(_preTestAnswers[qi]===q.answer)c++;});
  var btns=document.querySelectorAll('#pretest-questions .quiz-option'),idx=0;
  qs.forEach(function(q,qi){q.options.forEach(function(_,oi){if(oi===q.answer)btns[idx].classList.add('correct');if(oi===_preTestAnswers[qi]&&oi!==q.answer)btns[idx].classList.add('wrong');idx++;});});
  document.getElementById('pretest-container').innerHTML='<div class="result-banner '+(c>=3?'pass':'fail')+'">✅ '+c+'/'+qs.length+' 正确</div>';
  saveProgress({pre_test_done:true,pre_score:c});
}

function markComplete(){
  if(!confirm('确认完成本课学习？'))return;
  saveProgress({status:'done',completed_at:new Date().toISOString()});
  _progress[_currentLesson.id]=_progress[_currentLesson.id]||{};_progress[_currentLesson.id].status='done';
  toast('🎉 恭喜完成！');setTimeout(function(){closeDetail();loadLessons();},1000);
}

function saveProgress(data){
  var k=_currentLesson?_currentLesson.id:'',d=_progress[k]||{};
  Object.keys(data).forEach(function(x){d[x]=data[x]});_progress[k]=d;
  fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid:UID,lesson_id:k,data:d})}).catch(function(){});
}

function loadReportPage(){
  if(!UID)return;
  Promise.all([
    fetch(CONTENT+'/curriculum.json?_='+Date.now()).then(function(r){return r.json()}),
    fetch(API+'?uid='+UID+'&_='+Date.now()).then(function(r){return r.json()})
  ]).then(function(r){
    var all=r[0].lessons||[],pro=r[1].lessons||{},tt=r[1].total_time||0;
    var done=0;all.forEach(function(l){if((pro[l.id]||{}).status==='done')done++;});
    var p=all.length?Math.round(done/all.length*100):0;
    var h='<div class="card" style="text-align:center"><div style="font-size:48px;font-weight:700;color:var(--pri)">'+p+'%</div>';
    h+='<p style="color:var(--text2)">'+done+'/'+all.length+' 课时完成</p>';
    h+='<div class="progress-bar" style="margin:12px auto;max-width:200px"><div class="progress-fill" style="width:'+p+'%"></div></div>';
    h+='<p style="font-size:12px;color:var(--text2)">累计 '+tt+' 分钟</p></div>';
    all.forEach(function(l,i){
      var s=pro[l.id]||{},d=s.status==='done';
      h+='<div class="lesson-card'+(d?' done':'')+'"><div class="lesson-num" style="background:'+(d?'#e8f5e9':'#f0f0f0')+';color:'+(d?'var(--green)':'#999')+'">'+(i+1)+'</div>';
      h+='<div class="lesson-info"><h4>'+l.title+'</h4><div class="meta">'+(d?'✅ 已完成':(s.pre_test_done?'📝 已自测':'⬜ 未开始'))+'</div></div></div>';
    });
    document.getElementById('report-content').innerHTML=h;
    document.getElementById('report-subtitle').textContent='已学 '+done+' 课 · '+p+'%';
  }).catch(function(){});
}
document.querySelector('[data-page="report"]').addEventListener('click',loadReportPage);
</script>
</body>
</html>
